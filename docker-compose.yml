version: "3.8"
services:
    backend:
      image: frappe/erpnext:v15
      command: bench start
      volumes:
        - sites:/home/frappe/frappe-bench/sites
        - logs:/home/frappe/frappe-bench/logs
      depends_on:
        - mariadb
        - redis-cache
        - redis-queue

    mariadb:
      image: mariadb:10.6
      command:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --skip-character-set-client-handshake
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      volumes:
        - mariadb-data:/var/lib/mysql

    redis-cache:
      image: redis:alpine

    redis-queue:
      image: redis:alpine

    configurator:
      image: frappe/erpnext:v15
      command: >
        bash -c "
          bench set-config -g db_host mariadb &&
          bench set-config -g redis_cache redis://redis-cache:6379 &&
          bench set-config -g redis_queue redis://redis-queue:6379 &&
          bench new-site ${SITE_NAME} --mariadb-root-password ${DB_PASSWORD} --admin-password ${ADMIN_PASSWORD} --install-app helpdesk"
      depends_on:
        - mariadb
        - redis-cache
      volumes:
        - sites:/home/frappe/frappe-bench/sites

volumes:
    sites:
    logs:
    mariadb-data: